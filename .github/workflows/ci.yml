name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-lint:
    name: Format & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace -- -D warnings

  license:
    name: License check (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  test:
    name: Tests (std)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run workspace tests
        run: cargo test --workspace

  no-std:
    name: no_std build (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Library builds only. Test harnesses need std, which the bare-metal
      # target does not have, so `cargo test --target thumbv7em...` cannot work.
      # tpt-dev-contract and tpt-dev-mock-macros are proc-macro crates; tpt-dev-dep, tpt-dev-headers and tpt-dev-lint are std host tools.
      # All three run on the host only.
      - name: Build workspace for bare metal
        run: cargo build --workspace --exclude tpt-dev-contract --exclude tpt-dev-mock-macros --exclude tpt-dev-zk-macros --exclude tpt-dev-dep --exclude tpt-dev-headers --exclude tpt-dev-lint --target thumbv7em-none-eabihf

  # Loom concurrency tests for the Group 3 crates that have them. tpt-dev-mem
  # has no concurrent code, so it has no loom tests. Release mode keeps the
  # trace model (about 200 s locally) within the time budget.
  loom:
    name: Loom concurrency tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run loom tests (async, lock, trace)
        env:
          RUSTFLAGS: --cfg loom
        run: cargo test --release -p tpt-dev-async -p tpt-dev-lock -p tpt-dev-trace --test loom
