name: Release

# Manual only. Defaults to a dry run; set `execute` to true to publish.
on:
  workflow_dispatch:
    inputs:
      level:
        description: "Version bump level"
        required: true
        default: patch
        type: choice
        options: [patch, minor]
      execute:
        description: "Publish for real (false = dry run)"
        required: true
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: cargo-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install cargo-release
        run: cargo install cargo-release --locked
      - name: Dry run
        if: ${{ !inputs.execute }}
        run: cargo release ${{ inputs.level }} --workspace
      - name: Release
        if: ${{ inputs.execute }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo release ${{ inputs.level }} --workspace --execute --no-confirm
