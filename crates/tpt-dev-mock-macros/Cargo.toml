[package]
name = "tpt-dev-mock-macros"
description = "The #[mock] attribute for tpt-dev-mock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
categories = ["development-tools::testing"]

# A proc-macro crate runs on the host, so it cannot target no_std bare metal.
[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "proc-macro"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
