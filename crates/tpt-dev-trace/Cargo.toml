[package]
name = "tpt-dev-trace"
description = "Zero-allocation distributed tracing for embedded systems"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["tracing", "telemetry", "embedded", "observability"]
categories = ["development-tools::debugging", "development-tools::profiling", "embedded", "no-std", "no-std::no-alloc"]

[features]
default = []
std = []

[dependencies]
tpt-dev-lock = { version = "0.0.0", path = "../tpt-dev-lock" }

[target.'cfg(loom)'.dependencies]
loom.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
