[package]
name = "tpt-dev-profiler"
description = "Sampling profiler with function-level attribution and bounded per-sample cost"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["profiler", "sampling", "flamegraph", "embedded"]
categories = ["no-std", "development-tools::profiling", "embedded"]

[features]
default = []
std = []

[dev-dependencies]
# The budget gate example reuses the bench statistics and baseline format.
tpt-dev-bench = { version = "0.0.0", path = "../tpt-dev-bench", features = ["std"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
