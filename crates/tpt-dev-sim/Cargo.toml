[package]
name = "tpt-dev-sim"
description = "Cycle-accurate hardware simulator in safe Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["simulator", "cycle-accurate", "vcd", "hardware"]
categories = ["simulation", "emulators", "no-std", "no-std::no-alloc", "development-tools::testing"]

[features]
default = []
std = []

[dev-dependencies]
tpt-dev-mem = { version = "0.0.0", path = "../tpt-dev-mem" }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
