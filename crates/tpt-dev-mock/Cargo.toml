[package]
name = "tpt-dev-mock"
description = "Compile-time, zero-boilerplate mocking for traits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["mocking", "testing", "traits", "test-doubles"]
categories = ["development-tools::testing", "no-std"]

[features]
default = []
std = []

[dependencies]
tpt-dev-mock-macros = { version = "0.0.0", path = "../tpt-dev-mock-macros" }

[dev-dependencies]
trybuild = "1"
# Baseline for the compile-time benchmark in examples/compile_bench.rs.
mockall = "0.15"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
