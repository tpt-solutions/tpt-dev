[package]
name = "tpt-dev-zk-macros"
description = "#[circuit] attribute for tpt-dev-zk: writes a circuit version of an arithmetic function"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
categories = ["no-std"]

# A proc-macro crate runs on the host, so it cannot target no_std bare metal.
# CI builds it for the host only.
[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["full", "printing", "proc-macro"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
