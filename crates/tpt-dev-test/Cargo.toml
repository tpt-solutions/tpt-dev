[package]
name = "tpt-dev-test"
description = "Property-based testing with invariant generation for arithmetic constraints"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["property-testing", "shrinking", "invariants", "smt"]
