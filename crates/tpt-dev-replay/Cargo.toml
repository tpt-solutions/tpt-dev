[package]
name = "tpt-dev-replay"
description = "Deterministic execution recorder for replaying concurrent and embedded crashes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["replay", "record", "deterministic", "debugging"]
categories = ["development-tools::debugging", "development-tools::testing", "embedded", "no-std"]

[features]
default = []
std = []

[dependencies]
tpt-dev-async = { version = "0.0.0", path = "../tpt-dev-async" }
tpt-dev-trace = { version = "0.0.0", path = "../tpt-dev-trace" }

[dev-dependencies]
# The replay_spec example checks recorded runs against an automata machine.
tpt-dev-automata = { version = "0.0.0", path = "../tpt-dev-automata" }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
