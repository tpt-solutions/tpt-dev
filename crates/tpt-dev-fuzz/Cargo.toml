[package]
name = "tpt-dev-fuzz"
description = "Solver-guided structural fuzzer that generates inputs satisfying linear preconditions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["fuzzing", "fuzzer", "coverage-guided", "smt"]
categories = ["no-std", "development-tools::testing"]

[features]
default = []
std = []

[dependencies]
tpt-dev-solver = { version = "0.0.0", path = "../tpt-dev-solver" }
tpt-dev-test = { version = "0.0.0", path = "../tpt-dev-test" }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
