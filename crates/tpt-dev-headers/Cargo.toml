[package]
name = "tpt-dev-headers"
description = "C-header generator that emits Doxygen-ready headers from Rust documentation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
categories = ["development-tools::ffi"]

# A host tool: it parses Rust source with syn, which needs std. CI builds it for the host only.

[dependencies]
syn = { workspace = true, features = ["full", "parsing", "extra-traits"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
