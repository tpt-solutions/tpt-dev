[package]
name = "tpt-dev-contract"
description = "#[requires] and #[ensures] macros for compile-time provable design-by-contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
categories = ["no-std"]

# A proc-macro crate runs on the host, so it cannot target no_std bare metal.
# CI builds it for the host only.
[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["full", "parsing", "printing", "proc-macro"] }
tpt-dev-solver = { version = "0.0.0", path = "../tpt-dev-solver" }

[dev-dependencies]
trybuild = "1"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
