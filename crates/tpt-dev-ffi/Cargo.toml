[package]
name = "tpt-dev-ffi"
description = "Zero-copy FFI state machine framework for stateful C API lifetimes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
categories = ["no-std"]

[features]
default = []
std = []

[dev-dependencies]
trybuild = "1"
# Not in `workspace.dependencies`, so they are depended on by path.
tpt-dev-headers = { path = "../tpt-dev-headers" }
tpt-dev-automata = { path = "../tpt-dev-automata" }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
