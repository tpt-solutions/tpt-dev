[package]
name = "tpt-dev-sink"
description = "Zero-allocation, lock-free edge telemetry router for microcontrollers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["telemetry", "router", "back-pressure", "embedded"]
categories = ["embedded", "no-std", "no-std::no-alloc"]

[features]
default = []
std = []

[dependencies]
tpt-dev-lock = { version = "0.0.0", path = "../tpt-dev-lock" }
tpt-dev-trace = { version = "0.0.0", path = "../tpt-dev-trace" }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
