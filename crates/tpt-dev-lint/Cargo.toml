[package]
name = "tpt-dev-lint"
description = "Custom project-specific linting without compiler plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
categories = ["development-tools"]

# A host tool: it reads and parses source files, so it is std and excluded from the bare-metal build.

[dependencies]
syn = { workspace = true, features = ["full", "parsing", "visit", "extra-traits"] }
proc-macro2 = { workspace = true, features = ["span-locations"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
