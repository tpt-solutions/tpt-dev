[package]
name = "tpt-dev-async"
description = "Hard real-time no_std async runtime with bounded execution times"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
categories = ["no-std"]

[features]
default = []
std = []

[dependencies]
tpt-dev-trace = { version = "0.0.0", path = "../tpt-dev-trace" }

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
