[package]
name = "tpt-dev-async"
description = "Hard real-time no_std async runtime with bounded execution times"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["async", "executor", "real-time", "embedded"]
categories = ["asynchronous", "embedded", "no-std", "no-std::no-alloc"]

[features]
default = []
std = []

[dependencies]
tpt-dev-trace = { version = "0.0.0", path = "../tpt-dev-trace" }

[target.'cfg(loom)'.dependencies]
loom.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
