[package]
name = "tpt-dev-codec"
description = "Compile-time validated, zero-allocation serialization"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["serialization", "binary", "bitfield", "encoding"]
categories = ["no-std", "no-std::no-alloc", "encoding", "embedded"]

[features]
default = []
std = []

[dev-dependencies]
tpt-dev-test = { version = "0.0.0", path = "../tpt-dev-test" }
trybuild = "1"
# The schema_codegen example emits a dsl grammar and a parser that the generated tests use.
tpt-dev-dsl = { version = "0.0.0", path = "../tpt-dev-dsl" }
tpt-dev-codegen = { version = "0.0.0", path = "../tpt-dev-codegen" }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
