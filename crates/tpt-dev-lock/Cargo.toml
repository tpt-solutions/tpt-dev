[package]
name = "tpt-dev-lock"
description = "Deadlock-free synchronisation primitives with compile-time lock ordering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["lock-ordering", "deadlock", "spsc", "lock-free", "wait-free"]
categories = ["concurrency", "no-std", "no-std::no-alloc", "data-structures"]

[features]
default = []
std = []

[target.'cfg(loom)'.dependencies]
loom.workspace = true

[dev-dependencies]
trybuild = "1"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
