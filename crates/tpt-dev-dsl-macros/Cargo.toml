[package]
name = "tpt-dev-dsl-macros"
description = "The dsl! macro for tpt-dev-dsl: parses a grammar at compile time, with error spans"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["peg", "grammar", "proc-macro", "dsl"]
categories = ["development-tools", "parser-implementations"]

# A proc-macro crate runs on the host, so it cannot target no_std bare metal.
# CI builds it for the host only.
[lib]
proc-macro = true
# The grammar module is shared with tpt-dev-dsl by path, and its examples are
# written for that crate, so they are not run here.
doctest = false

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["full", "proc-macro"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
