[package]
name = "tpt-dev-doc"
description = "Interactive, runnable documentation with examples compiled to Wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["documentation", "wasm", "examples", "rustdoc"]
categories = ["no-std", "development-tools", "wasm"]

[features]
default = []
std = []

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "tpt-dev-doc-site"
path = "src/bin/tpt-dev-doc-site.rs"
required-features = ["std"]
