[package]
name = "tpt-dev-dsl"
description = "Domain-specific language framework built on tpt-dev-ast"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
categories = ["no-std"]

[features]
default = []
std = []
# The `dsl!` macro. Host-only: it pulls in a proc-macro crate, so leave it off
# for no_std targets.
macros = ["dep:tpt-dev-dsl-macros"]

[dependencies]
tpt-dev-dsl-macros = { version = "0.0.0", path = "../tpt-dev-dsl-macros", optional = true }

[dev-dependencies]
trybuild = "1"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
