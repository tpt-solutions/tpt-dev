[package]
name = "tpt-dev-automata"
description = "State machine logic verifier that proves deadlock freedom at compile time"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["state-machine", "deadlock", "verification", "const"]
categories = ["no-std", "algorithms"]

[features]
default = []
std = []

[dependencies]
tpt-dev-solver = { version = "0.0.0", path = "../tpt-dev-solver" }

[dev-dependencies]
trybuild = "1"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
